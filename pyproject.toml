[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bookbridge"
version = "1.0.0"
description = "AI Book & Novel Translation Desktop Application (English to Arabic)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "PyMuPDF>=1.23.0",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "Pillow>=10.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
]

[project.scripts]
bookbridge = "bookbridge.app:main"
